name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # The code branches on platform() to find each Claude client's config, writes
    # into the user's home directory, and shells out to git. Testing one OS was
    # testing a third of it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          # Node 26 on Linux as an early warning: node:sqlite is built in and
          # moves between releases.
          - os: ubuntu-latest
            node: 26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The store is a git repo, and the tests make real commits.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # No native modules to compile — the index uses the built-in node:sqlite.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Production dependencies only: a dev-only advisory should not block a fix.
      - run: npm audit --omit=dev --audit-level=high

  packaged:
    # CI was testing the source tree and publishing a tarball nobody had run.
    # Deleting dist/**/assets left the suite green while the built CLI died on
    # its first call, because the persona and skill assets are copied in by a
    # separate build step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and install the tarball somewhere else
        run: |
          npm pack --silent | tail -1 > /tmp/tarball
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE/$(cat /tmp/tarball)" --silent
      - name: The packaged CLI must actually run
        run: |
          cd /tmp/smoke
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          export AGENT_JULIA_CONFIG=/tmp/smoke/config.json
          cat > /tmp/smoke/config.json <<'JSON'
          { "schemaVersion": 1, "memoryDir": "/tmp/smoke/memory", "git": true, "surfaces": ["code"] }
          JSON
          mkdir -p /tmp/smoke/memory
          npx agent-julia migrate
          npx agent-julia doctor || true
          npx agent-julia reindex
          npx agent-julia search "anything" >/dev/null
          echo "packaged CLI ran"
